name: Deploy RangerWatch

on:
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: infra/terraform

      - run: terraform apply -auto-approve
        working-directory: infra/terraform